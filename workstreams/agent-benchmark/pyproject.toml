[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "react-bench"
version = "0.1.0"
description = "Benchmark-oriented Code ReAct runner for EvalPlus, LiveCodeBench, and KodCode"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
evalplus = ["evalplus"]
livecodebench = []
prepare = ["datasets>=2.18.0"]

[project.scripts]
react-bench = "react_bench.cli:main"

[tool.setuptools.packages.find]
include = ["react_bench*"]
