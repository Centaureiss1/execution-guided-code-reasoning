# ── Base → GRPO (hard dataset, no SFT) ──────────────────
model: /home/brui/cs639_final/models/Qwen3-1.7B

# ── 训练类型 ──────────────────────────────────────────
rlhf_type: grpo
train_type: lora
lora_rank: 16
lora_alpha: 32
target_modules: all-linear

# ── 数据 ──────────────────────────────────────────────
dataset: /home/brui/cs639_final/data/processed/grpo_train_hard.jsonl

# ── 精度 & 注意力 ─────────────────────────────────────
torch_dtype: bfloat16
attn_impl: sdpa

# ── GRPO 超参 ─────────────────────────────────────────
beta: 0.0
num_generations: 4
generation_batch_size: 4
reward_funcs: [code_exec, code_format]
reward_weights: [2.0, 0.5]
temperature: 0.9
top_k: 50
max_completion_length: 2048
max_length: 4096
truncation_strategy: left
dynamic_sample: true

# ── 显存优化 ──────────────────────────────────────────
gradient_checkpointing: true

# ── 训练超参 ──────────────────────────────────────────
max_steps: 800
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05

# ── 输出 & Checkpoint ─────────────────────────────────
output_dir: /home/brui/cs639_final/models/Qwen3-1.7B/phase2_grpo_base_hard
save_steps: 100
save_total_limit: 8
logging_steps: 5
log_completions: true
